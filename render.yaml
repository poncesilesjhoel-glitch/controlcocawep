# Configuración para desplegar en Render (https://render.com) como Blueprint.
services:
  - type: web
    name: control-coca
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # Conexión PostgreSQL permanente (por ejemplo Neon). Se configura en el panel de Render.
      - key: DATABASE_URL
        sync: false
      # Contraseña del usuario "admin" creado la primera vez.
      - key: ADMIN_CLAVE
        sync: false
